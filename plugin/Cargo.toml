[package]
name = "obs-multi-rtmp"
version = "0.3.0"
edition = "2021"
description = "OBS plugin for streaming to multiple destinations; logic in Rust, minimal Qt dock"
license = "GPL-2.0-or-later"
build = "build.rs"

[lib]
# Installed renamed as obs-multi-rtmp.dll (cargo does not allow hyphens in the lib name).
name = "obs_multi_rtmp"
crate-type = ["cdylib"]

[dependencies]
obs-rtmp-sessions = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
log = "0.4"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
