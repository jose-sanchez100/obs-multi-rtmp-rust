# Builds the universal macOS plugin (.pkg and .zip) and runs the engine tests.
# Signing and notarization run only when the MACOS_* secrets are configured;
# otherwise the plugin is ad-hoc signed and the installer is unsigned.
name: macOS

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # OBS 33 requires the macOS 26.5 SDK (Xcode 26.5) to build libobs.
    runs-on: macos-26
    env:
      HAVE_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps-macos
          key: macos-deps-${{ hashFiles('plugin/package-macos.sh') }}

      - name: Import signing certificates
        if: env.HAVE_SIGNING_CERT == 'true'
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build and package
        env:
          CODESIGN_IDENT: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          CODESIGN_IDENT_INSTALLER: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        # On failure, the end of the log is also published as an annotation, which is
        # readable without signing in to GitHub.
        run: |
          set -o pipefail
          if ! bash plugin/package-macos.sh 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 60 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$RUNNER_TEMP/tail.txt"
            echo "::error title=Build and package failed::$(cat "$RUNNER_TEMP/tail.txt")"
            exit 1
          fi

      # Summary of the package as an annotation (readable without signing in).
      - name: Inspect package
        run: |
          bin=target/package-macos/obs-multi-rtmp.plugin/Contents/MacOS/obs-multi-rtmp
          {
            lipo -info "$bin"
            otool -L "$bin" | grep -E 'rpath|obs|Qt'
            otool -l "$bin" | grep -A2 LC_RPATH | grep path
            codesign -dv "$bin" 2>&1 | grep -E 'Signature|Identifier|Format'
            pkgutil --payload-files dist/*-macos-universal.pkg | grep -E 'MacOS|Info.plist|es-ES'
            ls -l dist
          } > "$RUNNER_TEMP/inspect.txt" 2>&1
          cat "$RUNNER_TEMP/inspect.txt"
          echo "::notice title=macOS package::$(sed 's/%/%25/g' "$RUNNER_TEMP/inspect.txt" | awk 'BEGIN{ORS="%0A"} {print}')"

      - uses: actions/upload-artifact@v4
        with:
          name: obs-multi-rtmp-rust-macos-universal
          path: |
            dist/*-macos-universal.pkg
            dist/*-macos-universal.zip

      - name: Engine tests
        run: |
          set -o pipefail
          if ! cargo test --release -p obs-rtmp-sessions 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            grep -E 'panicked|FAILED|failures:|test result|assert|left|right|primary=' "$RUNNER_TEMP/test.log" | tail -n 40               | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$RUNNER_TEMP/tail.txt"
            echo "::error title=Engine tests failed::$(cat "$RUNNER_TEMP/tail.txt")"
            exit 1
          fi

      - name: Remove signing keychain
        if: always() && env.HAVE_SIGNING_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
