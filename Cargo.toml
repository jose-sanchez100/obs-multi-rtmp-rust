[package]
name = "obs-rtmp-sessions"
version = "0.1.0"
edition = "2021"
description = "Independent RTMP/RTMPS session manager with congestion isolation for obs-multi-rtmp"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
bytes = "1"
rml_rtmp = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
socket2 = "0.5"
log = "0.4"

# TCP statistics (RTT, retransmissions); already dependencies of socket2.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"

[workspace]
members = [".", "plugin"]
resolver = "2"
